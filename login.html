<!doctype html><html lang="tl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FINANIHAN - Login</title>
<style>body{font-family:Arial;background:#f4f8f2;display:flex;min-height:100vh;align-items:center;justify-content:center;padding:20px}.box{background:#fff;width:min(440px,100%);padding:30px;border-radius:18px;box-shadow:0 8px 30px #0001}h1,h2{text-align:center;color:#2e7d32}input,select,button{width:100%;padding:12px;margin:7px 0;border-radius:9px;border:1px solid #ccc;font:inherit}button{background:#2e7d32;color:#fff;border:0;font-weight:bold;cursor:pointer}.msg{padding:10px;border-radius:8px;margin:8px 0;display:none}.err{background:#fee;color:#b91c1c}.ok{background:#eaf7ea;color:#166534}</style></head><body><div class="box"><h1>🌾 FINANIHAN</h1><h2>Welcome Back</h2><div id="msg" class="msg"></div><form id="f"><select id="method"><option value="email">Email</option><option value="phone">Mobile Number</option></select><input id="contact" placeholder="you@email.com" required><input id="password" type="password" placeholder="Password" required><button type="button" id="send">Send Verification Code</button><input id="code" placeholder="6-digit code (email OTP)" inputmode="numeric" maxlength="6"><button>Log In</button></form><p style="text-align:center">No account? <a href="register.html">Create one</a></p></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase.js"></script><script>
const msg=document.getElementById('msg');function show(t,ok=false){msg.textContent=t;msg.className='msg '+(ok?'ok':'err');msg.style.display='block'}method.onchange=()=>{contact.placeholder=method.value==='email'?'you@email.com':'09XXXXXXXXX';contact.type=method.value==='email'?'email':'tel'};method.onchange();
send.onclick=async()=>{show('');if(method.value==='email'){const {error}=await supabaseClient.auth.signInWithOtp({email:contact.value.trim().toLowerCase(),options:{shouldCreateUser:false}});if(error)return show(error.message);show('Verification code sent to your email.',true)}else show('SMS OTP requires a phone/SMS provider to be enabled in Supabase.',false)};
f.onsubmit=async e=>{e.preventDefault();show('');let data,error;if(method.value==='email'){({data,error}=await supabaseClient.auth.verifyOtp({email:contact.value.trim().toLowerCase(),token:code.value.trim(),type:'email'}))}else{return show('Enable Phone Auth + an SMS provider in Supabase before using mobile OTP.')}
if(error)return show(error.message);if(!data.session)return show('Verification failed.');const meta=data.user.user_metadata||{};localStorage.setItem('shopHubCurrentUser',JSON.stringify({id:data.user.id,name:meta.full_name||'',email:data.user.email||'',phone:data.user.phone||'',role:meta.role||'buyer'}));localStorage.setItem('shopHubLoggedIn','true');location.href=(meta.role==='seller'?'farmer.html':'index.html')};</script></body></html>
